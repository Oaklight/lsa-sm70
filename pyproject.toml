[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsa-sm70"
dynamic = ["version"]
description = "Latent Sparse Attention (LSA) for NVIDIA V100 (SM70), as an SGLang attention backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Peng Ding" }]
keywords = ["lsa", "sparse-attention", "v100", "sm70", "sglang", "long-context"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "triton>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.entry-points."sglang.srt.plugins"]
lsa_sm70 = "lsa_sm70:register"

[project.urls]
Reference = "https://github.com/Prefrontal-AI/latent-sparse-attention"
SGLang = "https://github.com/sgl-project/sglang"

[tool.setuptools.dynamic]
version = { attr = "lsa_sm70.__version__" }

[tool.setuptools.packages.find]
include = ["lsa_sm70*"]

[tool.pytest.ini_options]
markers = ["gpu: requires an SM70 CUDA device"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
